# model setting
pretrained: 'None'
model_name: prodet
backbone_name: efficientnetb4
restore_ckpt: 'None'

# backbone setting
backbone_config:
  mode: original
  num_classes: 2
  inc: 3
  dropout: false

# dataset
dataset_json_folder: './preprocessing/dataset_json'
compression: c23
train_batchSize: 24
test_batchSize: 32
workers: 8
frame_num: {'train': 8, 'test': 32}
resolution: 256
with_mask: false
with_landmark: false

# label settings
label_dict:
  DFD_fake: 1
  DFD_real: 0
  FF-SH: 1
  FF-F2F: 1
  FF-DF: 1
  FF-FS: 1
  FF-NT: 1
  FF-FH: 1
  FF-real: 0
  CelebDFv1_real: 0
  CelebDFv1_fake: 1
  CelebDFv2_real: 0
  CelebDFv2_fake: 1
  DFDCP_Real: 0
  DFDCP_FakeA: 1
  DFDCP_FakeB: 1
  DFDC_Fake: 1
  DFDC_Real: 0
  DF_fake: 1
  DF_real: 0
  UADFV_Fake: 1
  UADFV_Real: 0
  SynthForensics_fake: 1
  SynthForensics_real: 0

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100
  remove_attribute: false
  gridmask_prob: 0
  remove_nose_prob: 0.0
  remove_eyes_prob: 0.0

# mean and std for normalization
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.00001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false
  sgd:
    lr: 0.00001
    momentum: 0.9
    weight_decay: 0.0001

# training config
lr_scheduler: null
lr_step: 3
lr_gamma: 0.4
nEpochs: 25
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024
save_ckpt: true
save_feat: true

losstype: null

# metric
metric_scoring: auc

# cuda
ngpu: 1
cuda: true
cudnn: true

# ProDet specific
comb_fake:
  bi: true
  bifake_ratio: 1
  blendfake_ratio: 1
  deepfake_ratio: 1
  order: sequence
  bifake_label: 3
  blendfake_label: 1
  deepfake_label: 2
  blend_spe_loc: null
  blend_loc: whole_face
  blend_loc_option: [whole_face, attribute, all, whole_att, trick_whole_face]
  cat_manner: linear

# loss function
loss_func: soft_cross_entropy

feature_operation: false
feature_adjust: true
Op_start: 0
linear_init: false
feature_drift: false
real_choice: 8
soft_bi: true
bi_topN: 3
early_stopping_patience: 5
