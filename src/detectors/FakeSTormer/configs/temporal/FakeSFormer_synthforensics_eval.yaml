# Base evaluation config for the SynthForensics benchmark.
# This file is used as a template by eval_synthforensics.py, which overrides
# DATASET.DATA.TEST.ROOT, DATASET.DATA.TEST.FAKETYPE, and
# DATASET.COMPRESSION at runtime for each (dataset, compression, generator)
# combination.

TASK: SynthForensics_eval
PRECISION: float64
METRICS_BASE: binary
SEED: 317
DATA_RELOAD: True

DATASET:
  type: FakeSFormerSBI
  DATA_TYPE: video
  TRAIN: False
  # COMPRESSION is used internally by _sampler to group frames into videos.
  # Any value in [c0, c23, c40, crf23, crf40, raw, canonical] is now accepted.
  # Override at runtime to match the actual compression being evaluated.
  COMPRESSION: crf23
  IMAGE_SUFFIX: png
  NUM_WORKERS: 8
  PIN_MEMORY: True
  IMAGE_SIZE: [224, 224]
  HEATMAP_SIZE: [14, 14]
  SIGMA: 1
  ADAPTIVE_SIGMA: False
  HEATMAP_TYPE: m_std_normalized
  SPLIT_IMAGE: False
  DATA:
    TYPE: videos
    SAMPLES_PER_VIDEO:
      ACTIVE: True
      TRAIN: 4
      VAL: 4
      TEST: 4
      NUM_FRAMES: 4
      DIST: [1., 1.]
    TRAIN:
      # Unused at eval time; must be present for config schema compliance.
      NAME: SynthForensics
      ROOT: /tmp/placeholder
      FROM_FILE: False
      FAKETYPE: [real]
      LABEL_FOLDER: [real, fake]
    VAL:
      NAME: SynthForensics
      ROOT: /tmp/placeholder
      FROM_FILE: False
      FAKETYPE: [real]
      LABEL_FOLDER: [real, fake]
    TEST:
      NAME: SynthForensics
      # Root is overridden at runtime by eval_synthforensics.py, e.g.:
      #   /path/to/preprocessed/SF-FF/crf23
      ROOT: preprocessed/SF-FF/crf23
      FROM_FILE: False
      # FAKETYPE is overridden at runtime.
      # Use ["real", "*"] to load all generators automatically, or
      # ["real", "cogvideox"] for a single-generator binary eval.
      FAKETYPE: [real, cogvideox]
      LABEL_FOLDER: [real, fake]
      ANNO_FILE: ''
  TRANSFORM:
    geometry:
      type: GeometryTransform
      resize: [224, 224, 0]
      normalize: 0
      horizontal_flip: 0.5
      cropping: [0.15, 0.]
      scale: [0.15, 0.]
      rand_erasing: [0.0, 1]
    color:
      type: ColorJitterTransform
      clahe: 0.0
      colorjitter: 0.3
      gaussianblur: 0.3
      gaussnoise: 0.3
      jpegcompression: [0.5, 40, 100]
      rgbshift: 0.3
      randomcontrast: 0.0
      randomgamma: 0.5
      randombrightness: 1
      huesat: 1
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  DEBUG: False
  DYNAMIC_FXRAY: True
  DYNAMIC_BLENDING_PROB: True
  TARGET_OVERLAP: True
  MASK_PROB: 0.01
  TEMP_MASKOUT: False

MODEL:
  type: TopDownDetector
  backbone:
    type: TimeViT
    img_size: [224, 224]
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4
    drop_path_rate: 0.3
    qkv_bias: True
    class_token: True
    register_token: False
    temp_token: True
    attention_type: divided_space_time
    num_frames: 4
    low_level_enhanced: False
  keypoint_head:
    type: TopdownHeatmapSimpleHead
    in_channels: 768
    hm_size: [14, 14]
    heads:
      hm: 1
      cls: 1
      temp_loc: 4
    loss_keypoint:
      type: JointsMSELoss
      use_target_weight: False
    extra:
      final_conv_kernel: 3
      num_conv_layers: 1
    conv_2direction: False
    use_temp_token: True
    features: 3D
    avg_pool: False
  INIT_WEIGHTS:
    pretrained: pretrained/mae_pretrain_vit_base.pth

TRAIN:
  gpus: [0]
  batch_size: 4
  lr: 0.0000001
  epochs: 200
  begin_epoch: -1
  warm_up: 5
  every_val_epochs: 1
  accumulation_steps: 1
  use_amp: False
  loss:
    type: CombinedMSELoss
    use_target_weight: False
    cls_lmda: 0.8
    dst_hm_cls_lmda: 0
    offset_lmda: 0
    hm_lmda: 100
    cstency_lmda: 0
    tmp_loc_lmda: 0.2
    mse_reduction: mean
    ce_reduction: mean
    use_ce: False
    temperature: 2
  optimizer: SAM
  distributed: False
  pretrained: ''
  tensorboard: False
  resume: False
  lr_scheduler:
    milestones: [5, 15, 20, 25]
    gamma: 0.5
  freeze_backbone: True
  debug:
    active: False
    save_hm_gt: True
    save_hm_pred: True
  booster: 500
  start_decay: 4

TEST:
  gpus: [0]
  subtask: 'eval'
  test_file: ''
  vis_hm: False
  threshold: 0.5
  flip_test: False
  video_level: True
  apr: True
  no_shot_preds: 1
  pred_file: ''
  save_preds: False
  pretrained: 'pretrained/TopDownDetector_C23_ViTBase224_ST_hm100_tempLOC0.2_4SBI_SAM_mp0.01_temp2_0vidAug_0.35_temp_normlms_normREAL_model_best.pth'
