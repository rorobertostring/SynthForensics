name: fakestormer

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.8
  - cudatoolkit=11.1
  - pytorch==1.8.0
  - torchvision==0.9.0
  - torchaudio==0.8.0
  - cmake
  - dlib  # requires cmake; prebuilt on conda-forge
  - pip
  - pip:
    - albumentations==1.1.0
    - imgaug==0.4.0
    - imutils==0.5.4
    - ipython
    - numpy==1.23.3
    - opencv-python==4.5.1.48
    - pandas==1.3.5
    - Pillow==9.3.0
    - python-box==7.1.1
    - PyYAML
    - scikit-image==0.19.3
    - scipy==1.9.3
    - simplejson
    - tensorboardX==2.5.1
    - natsort==8.4.0
    - einops
    - mmengine
    - plotly
    - ptflops==0.6.9
    - timm==0.6.13
    - tqdm
    # Installed by SF_scripts/setup_env.sh, not here:
    #   - torch/torchvision 1.8.0/0.9.0 +cu111 wheels (conda resolves pytorch==1.8.0 to a CPU build)
    #   - retinaface-pytorch==0.0.8 with --no-deps (its metadata pins torch==1.9.0 and albumentations==1.0.0)
    #   - mmcv-full 1.6.1 (needs --find-links to the openmmlab index)
