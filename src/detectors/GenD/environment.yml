name: gend

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - libgl              # required by opencv-python (libGL.so)
  - pip
  - pip:
    # ------------------------------------------------------------------ #
    #  PyTorch 2.8.0 + CUDA 12.8  (RTX Pro 6000 / A100 compatible)       #
    #  --extra-index-url must come first so conda passes it to pip        #
    # ------------------------------------------------------------------ #
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.8.0+cu128
    - torchaudio==2.8.0+cu128
    - torchvision==0.23.0+cu128

    # ------------------------------------------------------------------ #
    #  Deep learning / training stack                                     #
    # ------------------------------------------------------------------ #
    - lightning==2.5.5
    - transformers==4.56.2
    - timm==1.0.20
    - peft==0.15.2
    - pytorch-metric-learning==2.8.1

    # ------------------------------------------------------------------ #
    #  Vision & video I/O                                                 #
    # ------------------------------------------------------------------ #
    - opencv-python-headless==4.12.0.88
    - imageio==2.37.0
    - imageio-ffmpeg==0.6.0
    - av==16.1.0

    # ------------------------------------------------------------------ #
    #  ONNX runtime (GPU)                                                 #
    # ------------------------------------------------------------------ #
    - onnxruntime-gpu==1.21.0

    # ------------------------------------------------------------------ #
    #  Scientific / ML utilities                                          #
    # ------------------------------------------------------------------ #
    - scikit-learn==1.6.1
    - matplotlib==3.10.6
    - seaborn==0.13.2

    # ------------------------------------------------------------------ #
    #  Logging & monitoring                                               #
    # ------------------------------------------------------------------ #
    - rich==14.1.0
    - wandb==0.22.0
    - tensorboard            # pulled in by lightning anyway

    # ------------------------------------------------------------------ #
    #  Config / CLI / utilities                                           #
    # ------------------------------------------------------------------ #
    - pydantic==2.11.9
    - fire==0.7.0
    - tqdm==4.67.1
    - autoroot==1.0.1
    - autorootcwd==1.0.1

    # ------------------------------------------------------------------ #
    #  Development / Jupyter                                              #
    # ------------------------------------------------------------------ #
    - ipykernel==6.30.1
    - ruff==0.13.2

    # ------------------------------------------------------------------ #
    #  Gradio UI (app/run.py)                                             #
    # ------------------------------------------------------------------ #
    - gradio==5.49.1
