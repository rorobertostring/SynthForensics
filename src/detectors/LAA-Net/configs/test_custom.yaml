TASK: Custom_Dataset_Evaluation
PRECISION: float64
METRICS_BASE: binary
SEED: 317
DATA_RELOAD: False

DATASET:
  type: CustomDataset
  TRAIN: False
  COMPRESSION: c0       # Required by CommonDataset, not used by CustomDataset
  IMAGE_SUFFIX: png
  NUM_WORKERS: 4
  PIN_MEMORY: True
  IMAGE_SIZE: [384, 384]
  HEATMAP_SIZE: [96, 96]
  SIGMA: 2
  ADAPTIVE_SIGMA: True
  HEATMAP_TYPE: gaussian
  SPLIT_IMAGE: False

  DATA:
    TYPE: frames
    SAMPLES_PER_VIDEO:
      ACTIVE: False
      TRAIN: 32
      VAL: 32
      TEST: 32

    # TRAIN/VAL sections are required by CommonDataset even at test time
    TRAIN:
      NAME: Custom
      ROOT: /tmp/placeholder   # Not used by CustomDataset (FROM_FILE: False)
      FROM_FILE: False
      REAL_ROOT: /path/to/real_frames   # <-- CHANGE THIS
      FAKE_ROOT: /path/to/fake_frames   # <-- CHANGE THIS
      FAKETYPE: [real, fake]
      LABEL_FOLDER: [real, fake]
    VAL:
      NAME: Custom
      ROOT: /tmp/placeholder
      FROM_FILE: False
      REAL_ROOT: /path/to/real_frames   # <-- CHANGE THIS
      FAKE_ROOT: /path/to/fake_frames   # <-- CHANGE THIS
      FAKETYPE: [real, fake]
      LABEL_FOLDER: [real, fake]
    TEST:
      NAME: Custom
      ROOT: /tmp/placeholder
      FROM_FILE: False
      REAL_ROOT: /path/to/real_frames   # <-- CHANGE THIS
      FAKE_ROOT: /path/to/fake_frames   # <-- CHANGE THIS
      FAKETYPE: [real, fake]
      LABEL_FOLDER: [real, fake]

  # CustomDataset applies only resize + normalize directly (no pipeline transforms)
  TRANSFORM:
    geometry:
      type: GeometryTransform
      resize: [384, 384, 1]
      normalize: 0
      horizontal_flip: 0.0
      cropping: [0.15, 0.0]
      scale: [0.15, 0.0]
      rand_erasing: [0.0, 1]
    color:
      type: ColorJitterTransform
      clahe: 0.0
      colorjitter: 0.0
      gaussianblur: 0.0
      gaussnoise: 0.0
      jpegcompression: [0.0, 100, 100]
      rgbshift: 0.0
      randomcontrast: 0.0
      randomgamma: 0.0
      randombrightness: 0.0
      huesat: 0.0
    normalize:
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]

  DEBUG: False
  DYNAMIC_FXRAY: False

MODEL:
  type: PoseEfficientNet
  model_name: efficientnet-b4
  num_layers: B4
  include_top: False
  include_hm_decoder: True
  head_conv: 64
  use_c2: False
  use_c3: True
  use_c4: True
  use_c51: True
  efpn: True
  tfpn: False
  se_layer: False
  heads:
    hm: 1
    cls: 1
    cstency: 256
  INIT_WEIGHTS:
    pretrained: False
    advprop: True

TRAIN:
  gpus: [0]
  batch_size: 16
  lr: 0.00005
  epochs: 100
  begin_epoch: -1
  warm_up: 6
  every_val_epochs: 1
  loss:
    type: CombinedFocalLoss
    use_target_weight: False
    cls_lmda: 1
    dst_hm_cls_lmda: 0
    offset_lmda: 0
    hm_lmda: 10
    cstency_lmda: 100
    mse_reduction: sum
    ce_reduction: mean
  optimizer: SAM
  distributed: False
  pretrained: ''
  tensorboard: False
  resume: False
  lr_scheduler:
    milestones: [5, 15, 20, 25]
    gamma: 0.5
  freeze_backbone: False
  debug:
    active: False
    save_hm_gt: False
    save_hm_pred: False

TEST:
  gpus: [0]
  subtask: 'eval'
  test_file: ''
  vis_hm: False
  threshold: 0.5
  flip_test: True
  video_level: True
  # Choose one of the two available weights:
  #   BI model:  PoseEfficientNet_EFN_hm100_EFPN_NoBasedCLS_Focal_C3_256Cstency100_32BI_SAM(Adam)_ADV_Erasing1_OutSigmoid_model_best.pth
  #   SBI model: PoseEfficientNet_EFN_hm10_EFPN_NoBasedCLS_Focal_C3_256Cst100_8SBI_SAM(Adam)_ADV_Era1_OutSigmoid_1e7_boost500_UnFZ_model_best.pth
  pretrained: 'pretrained_weights/PoseEfficientNet_EFN_hm10_EFPN_NoBasedCLS_Focal_C3_256Cst100_8SBI_SAM(Adam)_ADV_Era1_OutSigmoid_1e7_boost500_UnFZ_model_best.pth'

PREPROCESSING:
  DATASET: Custom
  SPLIT: test
  ROOT: /tmp/placeholder
  FAKETYPE: [real, fake]
  IMAGE_SUFFIX: png
  DATA_TYPE: frames
  LABEL: [real, fake]
  facial_lm_pretrained: pretrained/shape_predictor_68_face_landmarks.dat
  DEBUG: False
