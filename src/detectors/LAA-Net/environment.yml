name: laa_net

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - cmake>=3.25        # required to build dlib from source
  - libgl              # required by opencv-python (libGL.so)
  - pip
  - pip:
    # ------------------------------------------------------------------ #
    #  PyTorch 2.8.0 + CUDA 12.8  (RTX Pro 6000 / A100 compatible)       #
    #  --extra-index-url must come first so conda passes it to pip        #
    # ------------------------------------------------------------------ #
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.8.0+cu128
    - torchvision==0.23.0+cu128

    # ------------------------------------------------------------------ #
    #  NumPy pinned to 1.23.x — imgaug 0.4.0 uses np.bool / np.int / ... #
    #  which were removed in NumPy 1.24.  torch 2.8 works fine with 1.23 #
    # ------------------------------------------------------------------ #
    - numpy==1.23.5

    # ------------------------------------------------------------------ #
    #  Core image / augmentation libraries                                #
    # ------------------------------------------------------------------ #
    - imgaug==0.4.0
    # albumentations 1.3.x: keeps the re-export of DualTransform in
    # albumentations.augmentations.transforms (used by geo_transform.py)
    # and is fully compatible with numpy 1.23
    - albumentations==1.3.1

    # ------------------------------------------------------------------ #
    #  Computer vision & scientific stack                                 #
    # ------------------------------------------------------------------ #
    - opencv-python==4.9.0.80
    - scikit-image==0.21.0
    - scipy==1.11.4
    - Pillow==9.5.0
    - pandas==1.5.3        # pandas 2.x has breaking APIs; 1.5.x is safe
    - dlib==19.24.5        # compiled wheel available for Python 3.10

    # ------------------------------------------------------------------ #
    #  Face / landmark utilities                                          #
    # ------------------------------------------------------------------ #
    - imutils==0.5.4

    # ------------------------------------------------------------------ #
    #  Training utilities                                                 #
    # ------------------------------------------------------------------ #
    - tensorboardX==2.6.2.2
    - torchcam              # used in cam_vis.py (visualization utility)
    # retinaface-pytorch==0.0.8 (face detection for the video pipeline) is installed
    # after creating the env with `pip install --no-deps` (see README.md):
    # its metadata pins torch==1.9.0, which would replace torch 2.8.0

    # ------------------------------------------------------------------ #
    #  General utilities                                                  #
    # ------------------------------------------------------------------ #
    - python-box==7.1.1
    - simplejson
    - tqdm
    - PyYAML
    - ipython
