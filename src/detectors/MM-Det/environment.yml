name: MM_Det
channels:
  - nvidia
  - defaults
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # CUDA toolkit (must be installed before pip packages)
  - cuda-toolkit=12.8.1

  - pip:
    # PyTorch with CUDA 12.8
    - torch==2.7.1+cu128
    - torchvision==0.22.1+cu128
    - torchaudio==2.7.1+cu128
    - --extra-index-url https://download.pytorch.org/whl/cu128

    # Core ML
    - transformers==4.37.2
    - tokenizers==0.15.1
    - sentencepiece==0.1.99
    - accelerate==0.21.0
    - peft==0.10.0
    - bitsandbytes==0.49.2
    - timm==0.9.16
    - einops==0.6.1
    - einops-exts==0.0.4

    # Vision / image
    - opencv-python==4.13.0.92
    - pillow==12.0.0
    - scikit-image==0.24.0

    # Data / math
    - numpy==2.2.6
    - scipy==1.15.3
    - scikit-learn==1.7.2

    # Utilities
    - shortuuid==1.0.13
    - pydantic==2.7.1
    - markdown2[all]
    - tensorboardX==2.6.2.2

    # Training extras (optional, needed only for LMM fine-tuning)
    # - deepspeed==0.18.8
    # - ninja
    # - wandb

    # NOTE: after creating the environment, run from the MM-Det root (see README.md):
    #   conda activate MM_Det
    #   pip install --no-deps -e LLaVA
    #   pip install --no-deps nvidia-cudnn-cu13==9.19.0.56 nvidia-cublas==13.1.0.3 nvidia-cuda-nvrtc==13.0.88
    #   pip install flash-attn==2.8.3 --no-build-isolation --no-cache-dir   # optional
    # Do not use --force-reinstall: it also reinstalls torch at its latest version.
