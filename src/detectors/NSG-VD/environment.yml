    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - tensorboard==2.20.0
    - torchinfo==1.8.0
    - git+https://github.com/openai/CLIP.git@ded190a052fdf4585bd685cee5bc96e0310d2c93
